name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build
        run: swift build -v

      - name: Test with coverage
        run: swift test -v --enable-code-coverage

      - name: Export coverage as lcov
        run: |
          BIN_PATH="$(swift build --show-bin-path)"
          XCTEST_PATH="$(find "$BIN_PATH" -name '*.xctest' | head -n 1)"
          BINARY_PATH="$XCTEST_PATH/Contents/MacOS/$(basename "$XCTEST_PATH" .xctest)"
          xcrun llvm-cov export -format="lcov" "$BINARY_PATH" \
            -instr-profile "$BIN_PATH/codecov/default.profdata" > coverage.lcov

      # Requires a CODECOV_TOKEN repo secret from codecov.io — soft-fails
      # (rather than blocking CI) until that's set up.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          files: coverage.lcov
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  lint:
    name: SwiftLint
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint lint --strict
