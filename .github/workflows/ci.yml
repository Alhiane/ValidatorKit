name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build
        run: swift build -v

      - name: Test with coverage
        run: swift test -v --enable-code-coverage

      - name: Export coverage as lcov
        run: |
          BIN_PATH="$(swift build --show-bin-path)"
          XCTEST_PATH="$(find "$BIN_PATH" -name '*.xctest' | head -n 1)"
          BINARY_PATH="$XCTEST_PATH/Contents/MacOS/$(basename "$XCTEST_PATH" .xctest)"
          xcrun llvm-cov export -format="lcov" "$BINARY_PATH" \
            -instr-profile "$BIN_PATH/codecov/default.profdata" > coverage.lcov

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        continue-on-error: true
        with:
          files: coverage.lcov
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  build-ios:
    name: Build (iOS Simulator)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: List available schemes
        run: xcodebuild -list

      - name: Build for iOS Simulator
        run: |
          xcodebuild -scheme ValidatorKit-Package \
            -destination 'generic/platform=iOS Simulator' \
            build

      - name: List available simulators
        run: xcrun simctl list devices available

      # `xcodebuild test` currently can't run ValidatorKitUIKitTests to completion:
      # testValidateOnInputChangeEnabled calls UIControl.sendActions(for:), which
      # requires a live UIApplication to dispatch target-action pairs. SPM test
      # bundles have no host app, so the call silently no-ops and the following
      # assert() crashes the whole xctest process. Tracked in #49. Building for
      # testing still exercises the real iOS compile path for the test target.
      - name: Build ValidatorKitUIKitTests for testing
        run: |
          xcodebuild build-for-testing \
            -scheme ValidatorKit-Package \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -only-testing:ValidatorKitUIKitTests

  lint:
    name: SwiftLint
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint lint --strict
